prefix: "<dark_gray>[<#4a6cf7>PluginGui<dark_gray>] <reset>"
player-only: "<red>Only players can use this command."
no-permission: "<red>You don't have permission to do that."
no-permission-command: "<red>You don't have permission to use <white>/{command}<red>."
reloaded: "<green>Config, menus and categories reloaded."
unknown-plugin: "<red>No plugin named <white>{plugin}<red> is installed."
unknown-category: "<red>No category named <white>{category}<red>."
usage-plugin: "<gray>Usage: <white>/pgui plugin <plugin name>"
click-suggest: "<gray>Click to type <#3aa0ff>/{command}<gray> in your chat box."
help-title: "<#4a6cf7><bold>PluginGui <gray>commands"
help-lines:
  - "<#3aa0ff>/pgui <gray>- open the plugin list"
  - "<#3aa0ff>/pgui plugin <name> <gray>- open one plugin's commands"
  - "<#3aa0ff>/pgui search <text> <gray>- search plugins by name"
  - "<#3aa0ff>/pgui edit <gray>- edit the player categories"
  - "<#3aa0ff>/pgui reload <gray>- reload files from disk"
  - "<#3aa0ff>/pcoms [category] <gray>- the player command menu"
player-help:
  - "<#3aa0ff>Click <gray>a category to see its commands."
  - "<#3aa0ff>Left-click <gray>a command to run it."
  - "<#3aa0ff>Right-click <gray>a command to put it in your chat box."
prompt-hint: "<gray>Type <white>cancel<gray> to abort. (Times out after {seconds}s)"
prompt-cancelled: "<gray>Cancelled."
prompt-timeout: "<gray>Prompt timed out."
prompt-search: "<yellow>Type part of a plugin name to search for."
prompt-rename: "<yellow>Type the new category name. MiniMessage colors work, e.g. <white><green>Building"
prompt-description: "<yellow>Type the description. Separate lines with <white>|<yellow>. Type <white>clear<yellow> to remove it."
prompt-icon: "<yellow>Type a material (<white>DIAMOND_SWORD<yellow>), <white>nexo:id<yellow>, <white>itemsadder:namespace:id<yellow>, or <white>hand<yellow> to use the item you hold."
prompt-create: "<yellow>Type a name for the new category."
invalid-icon: "<red>That is not a valid item."
category-created: "<green>Created category <white>{category}<green>."
category-updated: "<green>Category updated."
category-deleted: "<green>Category deleted."
move-hint: "<yellow>Click a slot (empty or another category) to move <white>{category}<yellow> there."
slot-moved: "<green>Category moved."
